# tag 'v*'
v*:
  tag_push:
    - services:
        - docker
      docker:
        image: docker.cnb.cool/elsejj/ci/py312-rust:latest
        volumes:
          - ./target:copy-on-write
          - /root/.cargo/registry:copy-on-write
      runner:
        tags: cnb:arch:amd64
        cpus: 16
      env:
        RUSTFLAGS: "-C target-feature=+sse4.2 -C target-feature=+avx2 -C target-feature=+pclmulqdq"
      stages:
        - name: extract version
          script: grep -o '^version = "[0-9.]*"' Cargo.toml | sed 's/version = "//' | sed 's/"$//'
          exports:
            info: MSD_VERSION
        - name: download github
          script:
            - mkdir github
            - curl -L -o github/msd-aarch64-apple-darwin.tar.gz https://github.com/msd-rs/msd/releases/download/v${MSD_VERSION}/msd-aarch64-apple-darwin.tar.gz
            - curl -L -o github/msd-x86_64-unknown-linux-gnu.tar.gz https://github.com/msd-rs/msd/releases/download/v${MSD_VERSION}/msd-x86_64-unknown-linux-gnu.tar.gz
            - curl -L -o github/msd-x86_64-pc-windows-msvc.zip https://github.com/msd-rs/msd/releases/download/v${MSD_VERSION}/msd-x86_64-pc-windows-msvc.zip
        - name: build
          script:
            - make release
            - zip -j msd-${MSD_VERSION}.zip ./target/release/msd
        - name: create release
          type: git:release
          options:
            overlying: true
            title: release "v${MSD_VERSION}"
            description: "v${MSD_VERSION}"
            latest: true
        - name: upload release file
          image: cnbcool/attachments:latest
          settings:
            tag: "v${MSD_VERSION}"
            attachments:
              - "./msd-${MSD_VERSION}.zip"
              - "./target/wheels/pymsd-${MSD_VERSION}-*.whl"
              - "./github/*"
          exports:
            FILES: FILES
        - name: set docker tag
          script: echo -n "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest"
          exports:
            info: IMAGE_TAG
        - name: build docker image
          script: docker build -t $IMAGE_TAG .
        - name: push docker image
          script: docker push $IMAGE_TAG
        - name: push python binding
          script:
            - export TWINE_USERNAME="cnb"
            - export TWINE_PASSWORD=$CNB_TOKEN
            - export TWINE_REPOSITORY_URL="https://pypi.cnb.cool/elsejj/pymsd/-/packages/simple"
            - twine upload target/wheels/pymsd-${MSD_VERSION}-*.whl
